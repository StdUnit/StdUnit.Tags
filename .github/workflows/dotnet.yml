# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: PushOrPR On Master Branch

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev"  ]

jobs:
  build:

    # 只在 Linux 上跑：省成本、反馈快（Windows runner 贵且常排队）。
    #
    # 能力边界（有意为之）：
    # * 构建 net472 —— 能。引用程序集来自 SDK 隐式引入的 Microsoft.NETFramework.ReferenceAssemblies 包
    #   （只要本机找不到 targeting pack 就会引入，与操作系统无关，见 Microsoft.NET.Sdk.FrameworkReferenceResolution.targets），
    #   所以"整解构建"顺带把 net472 的**编译**也校验了。
    # * 运行 net472 的测试 —— 不能（需要 .NET Framework 运行时），因此测试限定 -f net8.0。
    #   net472 的**运行**测试只在 release.yml（windows-latest，发版时全 TFM 跑一遍）与本机 Windows 上进行——
    #   这是刻意的取舍：PR 阶段不再执行 net472，用它换构建时长与成本。
    # * samples/WpfDemo（net8.0-windows + WPF）已从解决方案移除，目录保留，需要时在本机 Windows 上单独构建。
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.102

    - name: Restore Tool dependencies
      run: dotnet tool restore

    - name: Restore dependencies
      run: dotnet paket restore

    # 整解构建：net8.0 + net472 编译 + 三个 net8.0 示例，一次覆盖
    - name: Build (whole solution)
      run: dotnet build StdUnit.Tags.sln -c Release --nologo

    # 只跑 net8.0：net472 的测试需要 .NET Framework 运行时（其编译校验已由上一步覆盖）。
    # 覆盖率只统计 net8.0 —— 同一份源码，net472 专属分支在 net8.0 构建里根本不参与编译，不会被误记为未覆盖。
    - name: Test with Coverage (net8.0)
      run: dotnet test src/StdUnit.Tags.Tests/StdUnit.Tags.Tests.csproj -f net8.0 -c Release --no-build --nologo --collect:"XPlat Code Coverage" --results-directory ./TestResults

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v4
      env:
        PYTHONUTF8: 1
      with:
        # `directory` 指向报告所在文件夹（CLI 会递归查找），不要用 glob 展开成 `files` 列表
        directory: ./TestResults
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true
        verbose: true

  net472-on-mono:

    # 目的：让 net472 的**运行**测试也自动化，且不占 Windows runner 的排队时间。
    #
    # 定位：**补充信号**。mono ≠ .NET Framework（那才是发布物真正跑的运行时），mono 绿只能说明"大概率没退化"；
    # 权威结果仍是 release.yml（windows-latest 全 TFM）与开发机 Windows 上的运行。
    runs-on: ubuntu-latest
    # 所以设了 continue-on-error：mono 的伪失败不应挡住 PR。想让它硬性把关，删掉下面这一行。
    continue-on-error: false

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.102

    # 显式安装 Mono：不再依赖镜像预装（ubuntu-latest/24.04 不带 mono；22.04 才有，而那已经是退役在即的标签）。
    - name: Install mono
      run: sudo apt-get update && sudo apt-get install -y mono-complete

    # 显式确认 mono 真的可用：这一步的失败比 VSTest 的 "Could not find 'mono' host" 好读得多
    - name: Check mono
      run: mono --version

    - name: Restore Tool dependencies
      run: dotnet tool restore

    - name: Restore dependencies
      run: dotnet paket restore

    - name: Test (net472 on mono)
      run: dotnet test src/StdUnit.Tags.Tests/StdUnit.Tags.Tests.csproj --nologo

  aot-smoke:

    # 目的：以 NativeAOT 发布成原生可执行文件，并运行。
    # 两个测试：
    #   * `AotSmokeTest.LogicetPlugins`：无 <Logicet> 的正常加载 + TryAddLogicet<T> + AOT 下配了 <Logicet> 必须快速失败；
    #   * `AotSmokeTest.SimpleFiles`：基本类型测点 + JSON 测点（源生成元数据）读写 + AOT 下缺元数据必须快速失败。
    # 为什么在 Linux 跑：NativeAOT 在 ubuntu runner 上只需 clang + zlib1g-dev，比占 Windows runner 便宜，更重要的是不用排队；
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.102

    # NativeAOT 在 Linux 上需要 clang（负责最终链接）与 zlib1g-dev（zlib 头文件）。
    - name: Install Native AOT prerequisites
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

    - name: Restore Tool dependencies
      run: dotnet tool restore

    - name: Restore dependencies
      run: dotnet paket restore

    # 已知的第三方告警：McMaster.NETCore.Plugins（net8.0 的插件加载实现）自带 trim/AOT 分析告警 IL2104 / IL3053）。
    # 本库自己的代码在 AOT 分析下是 0 告警；
    # McMaster.NetCore.Plugins 的告警只在 publish 输出里出现，不影响本 job 的成败，也不代表示例的断言失败了 —— AOT 下根本走不到动态加载那条路。
    - name: Smoke test (LogicetPlugins, NativeAOT)
      run: |
        dotnet publish samples/AotSmokeTest.LogicetPlugins/AotSmokeTest.LogicetPlugins.csproj -c Release -r linux-x64 -o ./aot-smoke-out --nologo
        ./aot-smoke-out/AotSmokeTest.LogicetPlugins

    - name: Smoke test (SimpleFiles, NativeAOT)
      run: |
        dotnet publish samples/AotSmokeTest.SimpleFiles/AotSmokeTest.SimpleFiles.csproj -c Release -r linux-x64 -o ./aot-smoke-out --nologo
        ./aot-smoke-out/AotSmokeTest.SimpleFiles
