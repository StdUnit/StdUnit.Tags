# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: PushOrPR On Master Branch

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev"  ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.102

    - name: Restore Tool dependencies
      working-directory: .
      run: dotnet tool restore

    - name: Restore dependencies
      working-directory: .
      run: dotnet paket restore

    - name: build 
      working-directory: .
      run: dotnet build Itminus.Tags.sln

    - name: Test with Coverage
      working-directory: .
      run: dotnet test --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v4
      env:
        PYTHONUTF8: 1
      with:
        # `files` is a comma-separated list of explicit files, not a glob.
        # Now that Tests multi-targets net8.0;net472 there are several
        # coverage.cobertura.xml reports, so point the uploader at the folder
        # (the CLI searches it recursively) instead of expanding a glob.
        directory: ./TestResults
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true
        verbose: true