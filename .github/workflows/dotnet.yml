# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: PushOrPR On Master Branch

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev"  ]

jobs:
  build:

    # 只在 Linux 上跑：省成本、反馈快（Windows runner 贵且常排队）。
    #
    # 能力边界（有意为之）：
    # * 构建 net472 —— 能。引用程序集来自 SDK 隐式引入的 Microsoft.NETFramework.ReferenceAssemblies 包
    #   （只要本机找不到 targeting pack 就会引入，与操作系统无关，见 Microsoft.NET.Sdk.FrameworkReferenceResolution.targets），
    #   所以"整解构建"顺带把 net472 的**编译**也校验了。
    # * 运行 net472 的测试 —— 不能（需要 .NET Framework 运行时），因此测试限定 -f net8.0。
    #   net472 的**运行**测试只在 release.yml（windows-latest，发版时全 TFM 跑一遍）与本机 Windows 上进行——
    #   这是刻意的取舍：PR 阶段不再执行 net472，用它换构建时长与成本。
    # * samples/WpfDemo（net8.0-windows + WPF）已从解决方案移除，目录保留，需要时在本机 Windows 上单独构建。
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.102

    - name: Restore Tool dependencies
      run: dotnet tool restore

    - name: Restore dependencies
      run: dotnet paket restore

    # 整解构建：net8.0 + net472 编译 + samples/ 与 tests/ 下的 net8.0 可执行项目（示例、AOT 冒烟），一次覆盖
    - name: Build (whole solution)
      run: dotnet build StdUnit.Tags.sln -c Release --nologo

    # 只跑 net8.0：net472 的测试需要 .NET Framework 运行时（其编译校验已由上一步覆盖）。
    # 覆盖率只统计 net8.0 —— 同一份源码，net472 专属分支在 net8.0 构建里根本不参与编译，不会被误记为未覆盖。
    - name: Test with Coverage (net8.0)
      run: dotnet test tests/StdUnit.Tags.Tests/StdUnit.Tags.Tests.csproj -f net8.0 -c Release --no-build --nologo --collect:"XPlat Code Coverage" --results-directory ./TestResults

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v4
      env:
        PYTHONUTF8: 1
      with:
        # `directory` 指向报告所在文件夹（CLI 会递归查找），不要用 glob 展开成 `files` 列表
        directory: ./TestResults
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true
        verbose: true

    # 迭代产物通道：这**不是**发布，只是把每次构建的 13 个包传上来，好让现场用户/公测者提前试。
    # 版本号故意写成"构建号"（<基础版本>-dev.<run>.<attempt>），它不是语义化版本：
    #   * 落在"下一个计划发布的正式号"的预发布位上 ⇒ 排序上低于该正式号（正式版一发就自然覆盖），
    #     又高于此前任何正式版（装了它还能正常往前走，不会出现版本降级）；
    #   * 每次构建都唯一 ⇒ 不需要人工决定"这算 minor 还是 major"，也不占任何正式号位。
    # 基础版本号**不在这里写死**：唯一来源是仓库根的 next-release-version.txt，
    # 本步只传构建号，由 publish-packages.ps1 读该文件并拼成 <基础版本>-dev.<构建号>。
    # ⚠ 维护点：正式版发布后，把 next-release-version.txt 改成下一个计划发布的号
    #   （如 2.0.1），否则迭代产物的版本会低于已发布的正式版，装上它反而成了降级。
    #   详见 docs/设计决策与边界/3. 打包与发布.md。
    # 用法：从本 job 的 Artifacts 下载 dev-packages.zip，解压成一个文件夹源，然后
    #   dotnet nuget add source <解压目录> -n stdunit-dev
    # 注意：这里的版本号**不承诺任何兼容性**，只作"提前试"用，别做长期依赖。
    # 只在 push 到 main/dev 时产出（PR 不产，避免噪声 artifact 堆积）。
    - name: Pack dev packages (迭代产物，不发布)
      if: github.event_name == 'push'
      working-directory: ./src
      run: dotnet pwsh ./publish-packages.ps1 -DevBuildNumber "${{ github.run_number }}.${{ github.run_attempt }}" -SkipPush -OutputDir ../dev-packages

    - name: Upload dev packages
      if: github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: dev-packages
        # 用脚本 -OutputDir 指定的独立目录：直接 glob bin/Release 会把上次构建残留的旧版本 nupkg 也传上来
        path: dev-packages/*.nupkg
        retention-days: 30
        if-no-files-found: error

  net472-on-mono:

    # 目的：让 net472 的**运行**测试也自动化，且不占 Windows runner 的排队时间。
    #
    # 定位：**补充信号**。mono ≠ .NET Framework（那才是发布物真正跑的运行时），mono 绿只能说明"大概率没退化"；
    # 权威结果仍是 release.yml（windows-latest 全 TFM）与开发机 Windows 上的运行。
    runs-on: ubuntu-latest
    # 所以设了 continue-on-error：mono 的伪失败不应挡住 PR。想让它硬性把关，删掉下面这一行。
    continue-on-error: false

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.102

    # 显式安装 Mono：不再依赖镜像预装（ubuntu-latest/24.04 不带 mono；22.04 才有，而那已经是退役在即的标签）。
    - name: Install mono
      run: sudo apt-get update && sudo apt-get install -y mono-complete

    # 显式确认 mono 真的可用：这一步的失败比 VSTest 的 "Could not find 'mono' host" 好读得多
    - name: Check mono
      run: mono --version

    - name: Restore Tool dependencies
      run: dotnet tool restore

    - name: Restore dependencies
      run: dotnet paket restore

    - name: Test (net472 on mono)
      run: dotnet test tests/StdUnit.Tags.Tests/StdUnit.Tags.Tests.csproj --nologo

  aot-smoke:

    # 目的：以 NativeAOT 发布成原生可执行文件，并运行。
    # 三个测试：
    #   * `AotSmokeTest.LogicetPlugins`：无 <Logicet> 的正常加载 + TryAddLogicet<T> + AOT 下配了 <Logicet> 必须快速失败；
    #   * `AotSmokeTest.SimpleFiles`：基本类型测点 + JSON 测点（源生成元数据）读写 + AOT 下缺元数据必须快速失败；
    #   * `AotSmokeTest.WebStream`：起 Kestrel，结构树的**多态 JSON 序列化**（[JsonDerivedType]）+ SSE 从基线到增量的全链路。
    # 为什么在 Linux 跑：NativeAOT 在 ubuntu runner 上只需 clang + zlib1g-dev，比占 Windows runner 便宜，更重要的是不用排队；
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.102

    # NativeAOT 在 Linux 上需要 clang（负责最终链接）与 zlib1g-dev（zlib 头文件）。
    - name: Install Native AOT prerequisites
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

    - name: Restore Tool dependencies
      run: dotnet tool restore

    - name: Restore dependencies
      run: dotnet paket restore

    # 已知的第三方告警：McMaster.NETCore.Plugins（net8.0 的插件加载实现）自带 trim/AOT 分析告警 IL2104 / IL3053）。
    # 本库自己的代码在 AOT 分析下是 0 告警；
    # McMaster.NetCore.Plugins 的告警只在 publish 输出里出现，不影响本 job 的成败，也不代表示例的断言失败了 —— AOT 下根本走不到动态加载那条路。
    - name: Smoke test (LogicetPlugins, NativeAOT)
      run: |
        dotnet publish tests/AotSmokeTest.LogicetPlugins/AotSmokeTest.LogicetPlugins.csproj -c Release -r linux-x64 -o ./aot-smoke-out --nologo
        ./aot-smoke-out/AotSmokeTest.LogicetPlugins

    - name: Smoke test (SimpleFiles, NativeAOT)
      run: |
        dotnet publish tests/AotSmokeTest.SimpleFiles/AotSmokeTest.SimpleFiles.csproj -c Release -r linux-x64 -o ./aot-smoke-out --nologo
        ./aot-smoke-out/AotSmokeTest.SimpleFiles

    - name: Smoke test (WebStream, NativeAOT)
      run: |
        dotnet publish tests/AotSmokeTest.WebStream/AotSmokeTest.WebStream.csproj -c Release -r linux-x64 -o ./aot-smoke-out --nologo
        ./aot-smoke-out/AotSmokeTest.WebStream
