# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Release (nuget.org)

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: '常规版版本号：如 2.0.0（nuget.org 只收正式版；任何预发布 —— 含 -dev.<构建号> —— 一律走 baget）'
        required: true
jobs:
  build:
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job
      contents: read   # 让 checkout 能读到仓库内容

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    # nuget.org 上的版本不可撤销，而预发布已经由 release-baget.yml 推到私有源：
    # 这里把**任何**预发布号（含 -dev.<构建号>，以及已停用的 alpha/beta/rc）直接挡掉。放在最前面，几秒内失败。
    - name: Reject prerelease versions
      shell: pwsh
      env:
        RELEASE_VERSION: ${{ inputs.releaseVersion }}
      run: |
        $version = "$($env:RELEASE_VERSION)".Trim()
        if (-not $version) { throw 'releaseVersion 不能为空' }
        if ($version.Contains('-')) {
          throw "nuget.org 只收正式版（如 2.0.0）；预发布一律进私有源（Release (baget.stdunit.com) 的 versionKind=dev）：$version"
        }
        if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "版本号不合法：$version（正式版形如 2.0.0，不要带预发布后缀）" }

        "EFFECTIVE_VERSION=$version" >> $env:GITHUB_ENV
        "### 本次发布：``$version``（nuget.org）" >> $env:GITHUB_STEP_SUMMARY
        Write-Host "effective version = $version (nuget.org)"

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.102

    - name: Restore Tool dependencies
      working-directory: .
      run: dotnet tool restore

    - name: Restore dependencies
      working-directory: .
      run: dotnet paket restore

    # 用 Release 配置构建与测试：打包脚本本来就是 -c Release，这样"验的"和"发的"是同一份产物
    - name: build 
      working-directory: .
      run: dotnet build StdUnit.Tags.sln -c Release --nologo

    # ⚠ 两个测试项目**分成两步顺序跑**，不要用 `dotnet test` 直接打解决方案：
    # 那样 MSBuild 会并行启动多个 testhost（Tests/net8.0 + Tests/net472 + NetCoreOnly），
    # 而 windows-latest 只有 4 个 vCPU、WebUi 的观测流测试要跑真实轮询循环 + SSE 写循环，
    # 彼此抢 CPU 后 5s 级的等待窗口会偶发超时（2026-11 实测过一次打挂 3 个不相干的用例）。
    # 顺序跑的代价只有十几秒，换来的是"红就是真红"。
    - name: Test with Coverage (core, net8.0 + net472)
      working-directory: .
      run: dotnet test tests/StdUnit.Tags.Tests/StdUnit.Tags.Tests.csproj -c Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults --nologo

    - name: Test with Coverage (net8.0-only)
      working-directory: .
      run: dotnet test tests/StdUnit.Tags.Tests.NetCoreOnly/StdUnit.Tags.Tests.NetCoreOnly.csproj -c Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults --nologo

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v4
      env:
        PYTHONUTF8: 1
      with:
        # `files` is a comma-separated list of explicit files, not a glob.
        # Now that Tests multi-targets net8.0;net472 there are several
        # coverage.cobertura.xml reports, so point the uploader at the folder
        # (the CLI searches it recursively) instead of expanding a glob.
        directory: ./TestResults
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true
        verbose: true

    # Get a short-lived NuGet API key
    - name: nuget.org login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}  # Recommended: use a secret like for your nuget.org username (profile name), NOT your email address

    - name: push
      working-directory: ./src
      run: dotnet pwsh ./publish-packages.ps1 -packageVersion ${{ env.EFFECTIVE_VERSION }} -nugetKey ${{steps.login.outputs.NUGET_API_KEY}} -nugetSource https://api.nuget.org/v3/index.json

